{% extends 'base.html' %}{% block content %}<div class="card p-4 mx-auto" style="max-width:680px"><h2>{{'Edit product' if product else 'Add product'}}</h2><form method="post"><label>Product name</label><input class="form-control mb-3" name="product_name" maxlength="150" value="{{product.product_name if product else ''}}" required><label>SKU</label><input class="form-control mb-3" name="sku" maxlength="50" value="{{product.sku if product else ''}}" required><label>Category</label><input class="form-control mb-3" name="category" maxlength="100" value="{{product.category if product else ''}}"><label>Selling price (₹)</label><input class="form-control mb-3" type="number" step="0.01" min="0.01" name="price" value="{{product.price if product else ''}}" required>{% if not product %}<label>Opening stock</label><input class="form-control mb-3" type="number" min="0" name="stock_quantity" value="0" required>{% else %}<p class="text-muted">Current stock: {{product.stock_quantity}}. Use Stock to adjust quantities and preserve audit history.</p>{% endif %}<label>Low-stock threshold</label><input class="form-control mb-3" type="number" min="0" name="low_stock_threshold" value="{{product.low_stock_threshold if product else 10}}" required><button class="btn btn-primary">Save product</button><a class="btn btn-link" href="{{url_for('products')}}">Cancel</a></form></div>{% endblock %}
