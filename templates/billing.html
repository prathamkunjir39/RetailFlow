{% extends 'base.html' %}{% block content %}<h1>Point of Sale</h1><div class="card p-4"><form method="post" id="checkout"><input type="hidden" name="checkout_token" value="{{token}}"><div class="row g-3 mb-3"><div class="col-md-6"><label>Customer name (optional)</label><input class="form-control" name="customer_name" maxlength="150"></div><div class="col-md-3"><label>Discount %</label><input id="discount" class="form-control" name="discount" type="number" min="0" max="100" step="0.01" value="0" required></div><div class="col-md-3"><label>Tax %</label><input id="tax" class="form-control" name="tax" type="number" min="0" max="100" step="0.01" value="5" required></div></div><div id="cart"></div><button type="button" class="btn btn-outline-primary mb-3" onclick="addLine()">+ Add item</button><div class="text-end mb-3"><strong>Estimated total: ₹<span id="estimate">0.00</span></strong><p class="small text-muted">Final amounts are recalculated on the server.</p></div><button id="submitBtn" class="btn btn-success w-100">Generate invoice and deduct stock</button></form></div><template id="lineTemplate"><div class="row g-2 mb-2 cart-line"><div class="col-8"><select class="form-select product-select" name="product_id[]" required><option value="">Choose product</option>{% for p in products %}<option value="{{p.product_id}}" data-price="{{p.price}}">{{p.product_name}} — ₹{{p.price}} (stock {{p.stock_quantity}})</option>{% endfor %}</select></div><div class="col-3"><input class="form-control quantity" name="quantity[]" type="number" min="1" value="1" required></div><div class="col-1"><button type="button" class="btn btn-outline-danger" onclick="this.closest('.cart-line').remove();calculate()">×</button></div></div></template>{% endblock %}{% block scripts %}<script>function addLine(){document.querySelector('#cart').appendChild(document.querySelector('#lineTemplate').content.cloneNode(true));calculate()}function calculate(){let sub=0;document.querySelectorAll('.cart-line').forEach(row=>{let sel=row.querySelector('select');let p=Number(sel.selectedOptions[0]?.dataset.price||0);let q=Number(row.querySelector('.quantity').value||0);sub+=p*q});let d=Math.max(0,Math.min(100,Number(document.querySelector('#discount').value||0)));let t=Math.max(0,Math.min(100,Number(document.querySelector('#tax').value||0)));document.querySelector('#estimate').textContent=((sub*(1-d/100))*(1+t/100)).toFixed(2)}document.querySelector('#checkout').addEventListener('input',calculate);document.querySelector('#checkout').addEventListener('change',calculate);document.querySelector('#checkout').addEventListener('submit',()=>document.querySelector('#submitBtn').disabled=true);addLine();</script>{% endblock %}
