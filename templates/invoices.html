{% extends 'base.html' %}{% block content %}<div class="d-flex justify-content-between"><h1>Invoices</h1><a class="btn btn-primary align-self-center" href="{{url_for('billing')}}">New bill</a></div><div class="card p-3 table-responsive"><table class="table"><thead><tr><th>Invoice</th><th>Date</th><th>Customer</th><th>Cashier</th><th>Total ₹</th><th>Status</th></tr></thead><tbody>{% for i in invoices %}<tr><td><a href="{{url_for('invoice',invoice_id=i.invoice_id)}}">{{i.invoice_number}}</a></td><td>{{i.invoice_date}}</td><td>{{i.customer_name or 'Walk-in'}}</td><td>{{i.cashier}}</td><td>{{i.total_amount}}</td><td>{{i.status}}</td></tr>{% else %}<tr><td colspan="6">No invoices yet.</td></tr>{% endfor %}</tbody></table></div>{% endblock %}
