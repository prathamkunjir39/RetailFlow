{% extends 'base.html' %}{% block content %}<h1>Users and roles</h1><div class="card p-4 mb-4"><h4>Create user</h4><form method="post" class="row g-3"><div class="col-md-6"><label>Full name</label><input class="form-control" name="full_name" maxlength="100" required></div><div class="col-md-6"><label>Username</label><input class="form-control" name="username" maxlength="50" required></div><div class="col-md-6"><label>Password (8+ characters)</label><input class="form-control" name="password" type="password" minlength="8" required></div><div class="col-md-6"><label>Role</label><select class="form-select" name="role"><option value="cashier">Cashier</option><option value="admin">Admin</option></select></div><div class="col-12"><button class="btn btn-primary">Create user</button></div></form></div><div class="card p-3"><table class="table"><thead><tr><th>Name</th><th>Username</th><th>Role</th></tr></thead><tbody>{% for u in users %}<tr><td>{{u.full_name}}</td><td>{{u.username}}</td><td>{{u.role}}</td></tr>{% endfor %}</tbody></table></div>{% endblock %}
